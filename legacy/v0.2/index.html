<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1B2E">
  <title>PackDenDungeon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- ===================== 8.2.1 Startbildschirm ===================== -->
    <section id="screen-start" class="screen active">
      <canvas id="start-canvas" class="screen-canvas"></canvas>
      <div class="start-logo logo" id="start-logo">PackDenDungeon</div>
      <div class="start-blink">Tippen oder klicken zum Starten</div>
    </section>

    <!-- ===================== 8.2.2 Hauptmenü ===================== -->
    <section id="screen-menu" class="screen">
      <canvas id="menu-canvas" class="screen-canvas"></canvas>
      <div class="menu-left">
        <div class="logo menu-logo" id="menu-logo">PackDenDungeon</div>
        <button class="menu-btn menu-btn-fight" data-goto="chapters">Kampf</button>
        <button class="menu-btn" data-goto="starmap" id="menu-mastery">Sternenkarte <span class="menu-badge" id="menu-points"></span><span class="red-dot hidden" id="menu-dot"></span></button>
        <button class="menu-btn" data-goto="collection">Sammlung <span class="menu-badge" id="menu-collection"></span></button>
        <button class="menu-btn" data-goto="settings">Einstellungen</button>
        <button class="menu-btn pc-only" id="menu-quit">Beenden</button>
      </div>
      <div class="menu-stats panel" id="menu-stats"></div>
      <div class="version" id="version"></div>
    </section>

    <!-- ===================== 8.2.3 Kapitelauswahl ===================== -->
    <section id="screen-chapters" class="screen">
      <button class="btn back-btn" data-goto="menu">← Zurück</button>
      <div class="map-wrap">
        <canvas id="map-canvas"></canvas>
        <div id="map-points"></div>
      </div>
      <aside class="chapter-info panel" id="chapter-info"></aside>
    </section>

    <!-- ===================== 8.2.4 Kampfbildschirm ===================== -->
    <section id="screen-battle" class="screen">
      <canvas id="field"></canvas>

      <div class="topbar">
        <div class="tower-hp">
          <img class="px-icon" id="icon-tower" alt="">
          <div class="tower-bar" id="tower-bar"><div class="tower-fill" id="tower-fill"></div><span id="tower-text"></span></div>
        </div>
        <div class="wave-info">
          <div class="wave-text" id="wave-text"></div>
          <div class="wave-progress"><div id="wave-progress"></div></div>
        </div>
        <div class="gold-box">
          <img class="px-icon gold-icon" id="icon-gold" alt="">
          <span class="gold-num" id="gold-num">0</span>
          <button class="btn hud-btn" id="btn-pause" title="Pause (Leertaste)">II</button>
          <button class="btn hud-btn" id="btn-speed" title="Geschwindigkeit (S)">1×</button>
        </div>
      </div>

      <div class="boss-bar hidden" id="boss-bar">
        <div class="boss-name" id="boss-name"></div>
        <div class="boss-track"><div class="boss-fill" id="boss-fill"></div></div>
      </div>

      <div class="spell-column" id="spell-column"></div>

      <div class="bottombar">
        <div class="shop" id="shop"></div>
        <div class="team" id="team"></div>
      </div>

      <button class="btn call-wave hidden" id="btn-call-wave">Welle rufen ⏩</button>
      <div class="wave-banner hidden" id="wave-banner"></div>
      <div class="boss-banner hidden" id="boss-banner"></div>
      <div class="enemy-card panel hidden" id="enemy-card"></div>
      <div class="tip hidden" id="tip"><div class="tip-text" id="tip-text"></div><div class="tip-arrow" id="tip-arrow"></div></div>
      <div class="team-tooltip panel hidden" id="team-tooltip"></div>
      <div class="debug-panel panel hidden" id="debug-panel">
        <b>Debug</b>
        <button class="btn" data-debug="gold">+1000 Gold</button>
        <button class="btn" data-debug="skip">Welle überspringen</button>
        <button class="btn" data-debug="boss">Zur Bosswelle</button>
        <button class="btn" data-debug="heal">Turm heilen</button>
        <button class="btn" data-debug="lose">Run beenden</button>
      </div>
    </section>

    <!-- ===================== 8.2.9 Sternenkarte ===================== -->
    <section id="screen-starmap" class="screen">
      <canvas id="star-canvas"></canvas>
      <div class="star-currency">
        <div class="star-mp"><img class="px-icon" id="icon-rune" alt=""><span id="star-mp">0</span></div>
        <div class="star-sp"><img class="px-icon" id="icon-crystal" alt=""><span id="star-sp">0</span></div>
      </div>
      <div class="star-buttons">
        <button class="btn" id="star-center">Zentrieren</button>
        <button class="btn btn-danger" id="star-reset">Zurücksetzen</button>
        <button class="btn" id="star-back">Zurück</button>
      </div>
      <button class="btn btn-primary btn-big star-newrun" id="star-newrun">Neuer Run</button>
      <div class="star-info panel hidden" id="star-info"></div>
      <div class="star-banner hidden" id="star-banner"></div>
      <div class="star-flash" id="star-flash"></div>
    </section>

    <!-- ===================== 8.2.10 Sammlung ===================== -->
    <section id="screen-collection" class="screen screen-plain">
      <button class="btn back-btn" data-goto="menu">← Zurück</button>
      <div class="collection-head">
        <h2>Sammlung <span id="collection-count"></span></h2>
        <div class="filters" id="collection-filters"></div>
      </div>
      <div class="collection-grid" id="collection-grid"></div>
    </section>

    <!-- ===================== 8.2.11 Einstellungen ===================== -->
    <section id="screen-settings" class="screen screen-plain">
      <button class="btn back-btn" id="settings-back">← Zurück</button>
      <div class="settings panel">
        <h2>Einstellungen</h2>
        <label class="row-set">Musik <input type="range" min="0" max="100" data-volume="musicVolume"></label>
        <label class="row-set">Effekte <input type="range" min="0" max="100" data-volume="sfxVolume"></label>
        <label class="row-set">Schnelles Pack-Öffnen <input type="checkbox" data-setting="fastPackOpening"></label>
        <label class="row-set">Bildschirmwackeln <input type="checkbox" data-setting="screenShake"></label>
        <label class="row-set">Schadenszahlen <input type="checkbox" data-setting="damageNumbers"></label>
        <label class="row-set">Sprache
          <select id="language">
            <option value="de">Deutsch</option>
            <option value="en" disabled>English (bald)</option>
          </select>
        </label>
        <button class="btn btn-danger" id="btn-reset">Spielstand löschen</button>
        <div class="debug-meta hidden" id="debug-meta">
          <b>Debug:</b>
          <button class="btn" id="dbg-points">+100 Punkte</button>
          <button class="btn" id="dbg-unlock">Alle Kapitel</button>
          <button class="btn" id="dbg-collect">Alle Karten</button>
        </div>
      </div>
    </section>

    <!-- ===================== Overlays ===================== -->
    <div class="overlay hidden" id="overlay-pack">
      <div class="pack-light" id="pack-light"></div>
      <img class="pack-chest" id="pack-chest" alt="">
      <div class="pack-cards" id="pack-cards"></div>
      <button class="btn skip-btn" id="pack-skip">Überspringen ⏭</button>
    </div>

    <div class="overlay hidden" id="overlay-slots">
      <div class="panel slots-box">
        <h2>Slots voll!</h2>
        <p>Ersetze einen Helden (er wird für 50 % seines Wertes verkauft) oder verkaufe die neue Karte.</p>
        <div class="slots-body">
          <div class="slots-new" id="slots-new"></div>
          <div class="slots-heroes" id="slots-heroes"></div>
        </div>
        <button class="btn btn-primary" id="slots-sell"></button>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-pause">
      <div class="panel pause-box">
        <h2>Pause</h2>
        <button class="btn btn-primary btn-big" id="pause-resume">Weiter</button>
        <button class="btn btn-big" id="pause-settings">Einstellungen</button>
        <button class="btn btn-big btn-danger" id="pause-abandon">Run aufgeben</button>
        <div class="pause-stats" id="pause-stats"></div>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-runend">
      <div class="panel runend-box">
        <h1 id="runend-title"></h1>
        <div class="runend-wave" id="runend-wave"></div>
        <div class="runend-record hidden" id="runend-record">Neuer Rekord!</div>
        <div class="runend-points" id="runend-points"></div>
        <h3>Dein Team</h3>
        <div class="runend-team" id="runend-team"></div>
        <div class="row">
          <button class="btn btn-primary btn-big" id="runend-again">Nochmal</button>
          <button class="btn btn-big" id="runend-mastery">Sternenkarte</button>
          <button class="btn btn-big" id="runend-menu">Hauptmenü</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-unlock">
      <canvas id="confetti" width="1920" height="1080"></canvas>
      <div class="panel unlock-box" id="unlock-box"></div>
    </div>

    <div class="overlay hidden" id="overlay-card">
      <div class="panel card-detail" id="card-detail"></div>
    </div>

    <div class="overlay hidden" id="overlay-confirm">
      <div class="panel confirm-box">
        <p id="confirm-text"></p>
        <div class="row">
          <button class="btn btn-primary" id="confirm-yes">Ja</button>
          <button class="btn" id="confirm-no">Abbrechen</button>
        </div>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="fade" class="fade"></div>
  </div>
</div>

<div id="rotate-hint" class="rotate-hint">📱↻<br>Bitte das Gerät ins Querformat drehen.</div>
<div id="load-error" class="load-error hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
