<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1B2E">
  <title>PackDenDungeon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- Nur die Ziffern aus „Jersey 10“: Pixelify-„2“ und „5“ sehen aus wie Z und S -->
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&text=0123456789&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- 14.1 Startbildschirm -->
    <section id="screen-start" class="screen active">
      <canvas id="start-canvas" class="full-canvas"></canvas>
      <div class="start-logo logo" id="start-logo">PackDenDungeon</div>
      <div class="start-blink">Klicken zum Starten</div>
    </section>

    <!-- 14.2 Hub: Shop links, Reiter-Panel rechts -->
    <section id="screen-hub" class="screen">
      <canvas id="hub-canvas" class="full-canvas"></canvas>

      <div class="hub-chapter" id="hub-chapter">
        <div class="ch-arrows">
          <button class="ch-arrow" id="ch-prev" aria-label="Vorheriges Kapitel">▲</button>
          <button class="ch-arrow" id="ch-next" aria-label="Nächstes Kapitel">▼</button>
        </div>
        <div class="ch-text"><div class="ch-sub" id="ch-sub"></div><div class="ch-name" id="ch-name"></div></div>
        <div class="ch-extra" id="ch-extra"></div>
      </div>

      <div class="hub-shop" id="hub-shop">
        <div class="shop-head">
          <h2>SHOP</h2>
          <div class="shop-coins" title="verfügbare Münzen + Bonus-Münzen / Tagesbudget"><span id="shop-coins">0</span><span class="bonus" id="shop-bonus"></span><span class="budget" id="shop-budget"></span><img data-icon="coin" alt=""></div>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
        <div class="shop-buttons">
          <button class="btn shop-reset" id="shop-reset">RESET</button>
          <button class="btn shop-reroll" id="shop-reroll"></button>
        </div>
      </div>
      <div class="shop-info panel hidden" id="shop-info"></div>

      <div class="hub-tabs" id="hub-tabs">
        <button class="hub-tab" data-tab="upgrade" style="--tab:#3B78D8">UPGRADE<span class="red-dot hidden"></span></button>
        <button class="hub-tab" data-tab="sammlung" style="--tab:#D8D8E0">SAMMLUNG<span class="red-dot hidden"></span></button>
        <button class="hub-tab" data-tab="bestiarium" style="--tab:#E0603A">BESTIARIUM<span class="red-dot hidden"></span><span class="tab-lock" title="Ab Akt 2"></span></button>
        <button class="hub-tab" data-tab="relikte" style="--tab:#B23ED8">RELIKTE<span class="red-dot hidden"></span><span class="tab-lock" title="Ab Akt 2"></span></button>
      </div>
      <div class="hub-icons">
        <button class="icon-btn" data-goto="achievements" title="Erfolge"><img data-icon="crown" alt=""></button>
        <button class="icon-btn" data-goto="settings" title="Einstellungen"><img data-icon="settings" alt=""></button>
      </div>

      <div class="hub-panel" id="hub-panel">
        <!-- UPGRADE -->
        <div class="tab-page" data-page="upgrade">
          <canvas id="tree-canvas"></canvas>
          <div class="tree-wipe" id="tree-wipe"></div>
          <div class="tree-cur">
            <span class="cur-mp" title="Mastery (blauer Kristall)"><b id="tree-mp">0</b><img data-icon="mastery" alt=""></span>
            <span class="cur-fs" title="Schimmer (Foil-Staub, Regenbogen-Kristall)" id="tree-fs-wrap"><b id="tree-fs">0</b><img data-icon="crystal_regen" alt=""></span>
          </div>
          <div class="tree-nav">
            <button class="icon-btn foil-toggle hidden" id="tree-foil" title="Foil-Baum ein/aus"><img data-icon="crystal_regen" alt=""></button>
            <button class="icon-btn" id="tree-up" title="Ebene nach oben"><img data-icon="up" alt=""></button>
            <button class="icon-btn" id="tree-down" title="Ebene nach unten"><img data-icon="down2" alt=""></button>
          </div>
          <div class="tree-info panel hidden" id="tree-info"></div>
          <div class="tree-banner hidden" id="tree-banner"></div>
        </div>
        <!-- SAMMLUNG -->
        <div class="tab-page" data-page="sammlung">
          <div class="page-head"><div class="filters" id="col-filters"></div><div class="progress" id="col-progress"></div></div>
          <div class="tile-grid" id="col-grid"></div>
        </div>
        <!-- BESTIARIUM -->
        <div class="tab-page" data-page="bestiarium">
          <div class="page-head"><div class="progress" id="beast-progress"></div></div>
          <div class="beast-list" id="beast-list"></div>
        </div>
        <!-- RELIKTE -->
        <div class="tab-page" data-page="relikte">
          <div class="relic-slots" id="relic-slots"></div>
          <div class="relic-inv" id="relic-inv"></div>
          <div class="relic-detail" id="relic-detail"></div>
        </div>
      </div>
      <button class="btn fight-btn" id="btn-fight">KAMPF</button>
    </section>

    <!-- 14.5 Kampf -->
    <section id="screen-battle" class="screen">
      <canvas id="field" class="full-canvas"></canvas>
      <!-- 14.5: so wenig HUD wie möglich -->
      <div class="boss-warn hidden" id="boss-warn"></div>
      <div class="hud-progress" id="hud-progress"><div id="hud-progress-fill"></div></div>
      <div class="hud-bossbar hidden" id="hud-bossbar"><div class="bb-name" id="bb-name"></div><div class="bb-track"><div id="bb-fill"></div></div></div>
      <div class="hud-relics" id="hud-relics"></div>
      <div class="hud-counter"><div class="hc-main"><span id="hud-mastery">0</span><img id="hud-mastery-icon" alt=""></div><div class="hc-mult hidden" id="hud-mult"></div><div class="hc-shimmer hidden" id="hud-shimmer"></div></div>
      <button class="hud-gear" id="btn-pause" title="Pause / Einstellungen"><img data-icon="settings" alt=""></button>
      <div class="hud-quests hidden" id="hud-quests"></div>
      <div class="relic-tip hidden" id="relic-tip"></div>
      <div class="banner hidden" id="banner"></div>
      <div class="info-pop panel hidden" id="info-pop"></div>
      <div class="debug-panel panel hidden" id="debug-panel">
        <b>Debug</b>
        <button class="btn" data-debug="shiny">Shiny-Monster</button>
        <button class="btn" data-debug="time">+30 s</button>
        <button class="btn" data-debug="boss">Boss jetzt</button>
        <button class="btn" data-debug="pack">+Silberpack</button>
        <button class="btn" data-debug="end">Run beenden</button>
      </div>
    </section>

    <!-- 14.12 Erfolge (Quests gibt es nur als Knoten im Skill-Tree) -->
    <section id="screen-achievements" class="screen screen-plain">
      <button class="btn back-btn" data-goto="hub">← Zurück</button>
      <h1 class="screen-title">Erfolge <span id="ach-progress"></span></h1>
      <div class="list ach" id="ach-list"></div>
    </section>

    <!-- 14.13 Einstellungen -->
    <section id="screen-settings" class="screen screen-plain">
      <button class="btn back-btn" id="settings-back">← Zurück</button>
      <div class="settings panel">
        <h2>Einstellungen</h2>
        <label class="row-set">Musik <input type="range" min="0" max="100" data-volume="musicVolume"></label>
        <label class="row-set">Effekte <input type="range" min="0" max="100" data-volume="sfxVolume"></label>
        <label class="row-set">Effekt-Transparenz <input type="range" min="20" max="100" data-percent="effectAlpha"></label>
        <label class="row-set">Bildschirmwackeln <input type="checkbox" data-setting="screenShake"></label>
        <label class="row-set">Schadenszahlen <input type="checkbox" data-setting="damageNumbers"></label>
        <label class="row-set">Schnelles Pack-Öffnen <input type="checkbox" data-setting="fastPackOpening"></label>
        <label class="row-set">Animationen überspringen <input type="checkbox" data-setting="skipAnimations"></label>
        <label class="row-set">Sprache <select id="language"><option value="de">Deutsch</option><option value="en" disabled>English (bald)</option></select></label>
        <button class="btn btn-danger" id="btn-reset">Spielstand löschen</button>
        <div class="debug-meta hidden" id="debug-meta"><b>Debug:</b>
          <button class="btn" id="dbg-currency">+1000 aller Währungen</button>
          <button class="btn" id="dbg-chapters">Kapitel freischalten</button>
          <button class="btn" id="dbg-cards">Alle Karten</button>
          <button class="btn" id="dbg-relics">Alle Relikte</button>
        </div>
      </div>
    </section>

    <!-- Overlays -->
    <!-- 14.6 Neue-Karte-Präsentation -->
    <div class="overlay hidden" id="overlay-newcard">
      <div class="nc">
        <div class="nc-shiny hidden" id="nc-shiny">SHINY!</div>
        <div class="nc-name" id="nc-name"></div>
        <div class="nc-ability" id="nc-ability"></div>
        <div class="nc-stage"><canvas id="nc-blob" width="420" height="420"></canvas><img id="nc-fig" alt=""><div class="nc-sheen hidden" id="nc-sheen"></div></div>
        <div class="nc-next">&gt;</div>
      </div>
      <div class="nc-hint">Klicken zum Fortfahren</div>
    </div>
    <!-- 14.6b Freischaltung -->
    <div class="overlay hidden" id="overlay-unlock">
      <canvas id="ul-rays" width="1000" height="1000"></canvas>
      <img id="ul-img" alt="">
      <div class="ul-text"><div class="ul-title" id="ul-title"></div><div class="ul-name" id="ul-name"></div></div>
      <div class="nc-next ul-next">&gt;</div>
    </div>
    <div class="overlay hidden" id="overlay-card"><div class="card-detail" id="card-detail"></div></div>
    <div class="overlay hidden" id="overlay-pause">
      <div class="panel pause-box">
        <h2>Pause</h2>
        <button class="btn btn-primary btn-big" id="pause-resume">Weiter</button>
        <button class="btn btn-big" id="btn-speed">Tempo: 1×</button>
        <button class="btn btn-big" id="pause-settings">Einstellungen</button>
        <button class="btn btn-big btn-danger" id="pause-end">Run beenden</button>
        <p class="muted">Beim Beenden bleiben alle Belohnungen erhalten.</p>
      </div>
    </div>
    <div class="overlay hidden" id="overlay-result"><div class="panel result-box" id="result-box"></div></div>
    <div class="overlay hidden" id="overlay-popup"><canvas id="confetti" width="1920" height="1080"></canvas><div class="panel popup-box" id="popup-box"></div></div>
    <div class="overlay hidden" id="overlay-confirm">
      <div class="panel confirm-box"><p id="confirm-text"></p>
        <div class="row"><button class="btn btn-primary" id="confirm-yes">Ja</button><button class="btn" id="confirm-no">Abbrechen</button></div></div>
    </div>
    <div class="tip hidden" id="tip"><div class="tip-text" id="tip-text"></div><div class="tip-arrow" id="tip-arrow"></div></div>
    <div id="toasts"></div>
    <div id="fade" class="fade"></div>
  </div>
</div>
<div class="rotate-hint">↻<br>Bitte das Gerät ins Querformat drehen.</div>
<div id="load-error" class="load-error hidden"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
